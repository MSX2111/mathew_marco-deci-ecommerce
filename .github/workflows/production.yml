name: ShopSphere Production Pipeline

on:
  push:
    branches:
      - main

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

  build:
    name: Build application
    runs-on: ubuntu-latest
    needs: install
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # IMPORTANT: this job gets a fresh runner,
      # so dependencies must be installed again.
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ---------------- FRONTEND ----------------

      - name: Link frontend Vercel project
        working-directory: client
        run: |
          vercel link \
            --yes \
            --project "${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}" \
            --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Pull frontend production environment
        working-directory: client
        run: |
          vercel pull \
            --yes \
            --environment production \
            --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Build frontend
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          vercel build \
            --prod \
            --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy frontend
        working-directory: client
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token "${{ secrets.VERCEL_TOKEN }}"

      # ---------------- BACKEND ----------------

      - name: Link backend Vercel project
        working-directory: server
        run: |
          vercel link \
            --yes \
            --project "${{ secrets.VERCEL_BACKEND_PROJECT_ID }}" \
            --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Pull backend production environment
        working-directory: server
        run: |
          vercel pull \
            --yes \
            --environment production \
            --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Build backend
        working-directory: server
        run: |
          vercel build \
            --prod \
            --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy backend
        working-directory: server
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token "${{ secrets.VERCEL_TOKEN }}"
