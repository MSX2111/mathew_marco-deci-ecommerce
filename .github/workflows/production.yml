name: ShopSphere Production Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

  build:
    name: Build application
    runs-on: ubuntu-latest
    needs: install
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    environment: production

    # Only deploy when the change has actually reached main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # ---------------- FRONTEND ----------------

      - name: Link frontend Vercel project
        run: |
          mkdir -p .vercel

          cat > .vercel/project.json <<EOF
          {
            "orgId": "${{ secrets.VERCEL_ORG_ID }}",
            "projectId": "${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}"
          }
          EOF

      - name: Deploy frontend
        run: |
          vercel deploy . \
            --prod \
            --yes \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Remove frontend Vercel configuration
        run: rm -rf .vercel

      # ---------------- BACKEND ----------------

      - name: Link backend Vercel project
        run: |
          mkdir -p .vercel

          cat > .vercel/project.json <<EOF
          {
            "orgId": "${{ secrets.VERCEL_ORG_ID }}",
            "projectId": "${{ secrets.VERCEL_BACKEND_PROJECT_ID }}"
          }
          EOF

      - name: Deploy backend
        run: |
          vercel deploy . \
            --prod \
            --yes \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Remove backend Vercel configuration
        run: rm -rf .vercel
